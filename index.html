<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PREMIUM KEY GEN - CROSS MODS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, monospace;
        }
        body {
            background: radial-gradient(circle at 30% 10%, #0a0f1e, #03060c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .screen {
            background: rgba(10, 15, 28, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            width: 100%;
            max-width: 460px;
            transition: all 0.2s;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        .screen-content {
            padding: 28px 22px 36px;
        }
        h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #fff, #3bc0fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 6px;
        }
        .sub {
            text-align: center;
            color: #8aa0c0;
            font-size: 11px;
            margin-bottom: 28px;
        }
        .option-row {
            background: #050a14aa;
            border-radius: 60px;
            padding: 6px;
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
        }
        .opt-btn {
            flex: 1;
            background: #111a2a;
            border: none;
            padding: 12px 0;
            border-radius: 50px;
            color: #bbddff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .opt-btn.active {
            background: #2a4c7a;
            color: white;
            box-shadow: 0 0 6px cyan;
        }
        .premium-badge {
            background: #ffaa33;
            color: #111;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 30px;
            margin-left: 5px;
        }
        .generate-btn {
            background: linear-gradient(90deg, #3bc0fc, #1a5c9e);
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin: 16px 0;
            cursor: pointer;
        }
        .generate-btn:active { transform: scale(0.97); }
        
        /* LAYAR HASIL */
        .result-card {
            background: #0b1122cc;
            border-radius: 40px;
            padding: 24px 18px;
            text-align: center;
            border: 1px solid #0f0;
            margin-bottom: 20px;
        }
        .key-label {
            font-size: 11px;
            color: #6c86a8;
            letter-spacing: 2px;
        }
        .key-value {
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
            background: #000000aa;
            padding: 10px;
            border-radius: 40px;
            margin: 12px 0;
            color: #0f0;
            word-break: break-all;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            background: #03060e;
            padding: 10px 16px;
            border-radius: 60px;
            margin: 8px 0;
        }
        .back-btn {
            background: #2a3a60;
            border: none;
            padding: 12px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
        .device-note {
            font-size: 11px;
            color: #ffaa55;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<!-- LAYAR 1: GENERATOR -->
<div id="screenGen" style="display: block;">
    <div class="screen">
        <div class="screen-content">
            <h1>⚡ CROSS MODS PANEL ⚡</h1>
            <div class="sub">FREE FIRE - LICENSE GENERATOR</div>
            <div class="option-row">
                <button class="opt-btn" data-days="1">1 DAY</button>
                <button class="opt-btn" data-days="7">7 DAYS</button>
                <button class="opt-btn" data-days="30">30 DAYS <span class="premium-badge">PREMIUM</span></button>
            </div>
            <button class="generate-btn" id="genButton">✨ GENERATE KEY ✨</button>
            <div class="device-note">🔒 Setiap key hanya untuk 1 device</div>
        </div>
    </div>
</div>

<!-- LAYAR 2: HASIL KEY (hidden dulu) -->
<div id="screenResult" style="display: none;">
    <div class="screen">
        <div class="screen-content">
            <div class="result-card">
                <div class="key-label">🔑 YOUR GENERATED KEY 🔑</div>
                <div class="key-value" id="keyDisplay">XXXX-XXXX-XXXX</div>
                <div class="info-row">
                    <span>📅 EXPIRY</span>
                    <span id="expDisplay">30 DAYS</span>
                </div>
                <div class="info-row">
                    <span>📱 DEVICE LIMIT</span>
                    <span>MAX 1 DEVICE</span>
                </div>
            </div>
            <button class="back-btn" id="backButton">◀ GENERATE LAGI</button>
            <div class="device-note" id="bindMsg">✅ Key siap diaktivasi. Belum terikat device.</div>
        </div>
    </div>
</div>

<script>
    // =============== STATE ===============
    let currentDays = 1;
    
    // Fungsi generate key random (format: XXXX-XXXX-XXXX-XXXX + kode durasi)
    function generateKey(days) {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
        let parts = [];
        for (let i = 0; i < 4; i++) {
            let part = '';
            for (let j = 0; j < 4; j++) {
                part += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            parts.push(part);
        }
        let durCode = (days === 1) ? '1D' : (days === 7 ? '7D' : '30D');
        return parts.join('-') + '-' + durCode;
    }
    
    // Tampilkan layar hasil
    function showResult(days) {
        let newKey = generateKey(days);
        document.getElementById('keyDisplay').innerText = newKey;
        document.getElementById('expDisplay').innerText = days + ' DAYS';
        
        // (Opsional) simulasi binding device: hanya tampilan, tanpa localStorage dulu biar ga error
        document.getElementById('bindMsg').innerHTML = '🔒 Key hanya bisa diaktivasi di 1 HP (simulasi)';
        
        // pindah layar
        document.getElementById('screenGen').style.display = 'none';
        document.getElementById('screenResult').style.display = 'block';
    }
    
    // =============== EVENT HANDLER ===============
    // Pilihan durasi (tampilan active)
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(btn => {
        btn.addEventListener('click', function() {
            btns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentDays = parseInt(this.getAttribute('data-days'));
        });
    });
    
    // Tombol GENERATE
    document.getElementById('genButton').addEventListener('click', function() {
        showResult(currentDays);
    });
    
    // Tombol BACK (generate lagi)
    document.getElementById('backButton').addEventListener('click', function() {
        document.getElementById('screenGen').style.display = 'block';
        document.getElementById('screenResult').style.display = 'none';
    });
    
    // Set default active 1 day
    document.querySelector('.opt-btn[data-days="1"]').classList.add('active');
</script>
</body>
</html>
