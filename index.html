<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROSS MODS KEY GEN</title>
    <style>
        body {
            background: black;
            color: cyan;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: #111;
            border: 2px solid cyan;
            border-radius: 30px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
        }
        .sub {
            font-size: 12px;
            color: #888;
            margin-bottom: 30px;
        }
        .durasi {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .durasi button {
            flex: 1;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .durasi button.active {
            background: #00aaff;
            color: black;
            border-color: cyan;
        }
        .premium {
            background: #ff8800 !important;
            color: black !important;
        }
        .gen-btn {
            width: 100%;
            padding: 15px;
            background: #00aaff;
            border: none;
            color: black;
            font-size: 18px;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .result-area {
            background: #000;
            border: 1px solid #0f0;
            border-radius: 20px;
            padding: 15px;
            margin-top: 20px;
            display: none;
        }
        .key {
            font-size: 18px;
            font-weight: bold;
            color: #0f0;
            letter-spacing: 2px;
            word-break: break-all;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 15px;
        }
        .info {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }
        .back-btn {
            background: #333;
            border: none;
            padding: 10px;
            color: white;
            border-radius: 40px;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
        }
        .note {
            font-size: 11px;
            color: #ffaa55;
            margin-top: 15px;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box" id="mainBox">
    <h1>⚡ CROSS MODS PANEL ⚡</h1>
    <div class="sub">FREE FIRE LICENSE GENERATOR</div>

    <div class="durasi" id="durasiPanel">
        <button data-hari="1">1 DAY</button>
        <button data-hari="7">7 DAYS</button>
        <button data-hari="30" id="premiumBtn">30 DAYS (PREMIUM)</button>
    </div>

    <button class="gen-btn" id="tombolGen">✨ GENERATE KEY ✨</button>
    <div class="note">🔒 Max 1 device per key</div>

    <!-- Tempat hasil (awalnya hidden) -->
    <div id="hasilPanel" class="result-area">
        <div style="font-size:12px; color:#aaa;">🔑 YOUR LICENSE KEY</div>
        <div class="key" id="tampilKey">XXXX-XXXX-XXXX</div>
        <div class="info">
            <span>📅 EXPIRY</span>
            <span id="tampilExp">30 DAYS</span>
        </div>
        <div class="info">
            <span>📱 DEVICE LIMIT</span>
            <span>MAX 1 DEVICE</span>
        </div>
        <button class="back-btn" id="tombolBack">◀ GENERATE LAGI</button>
    </div>
</div>

<script>
    // =============== AMBIL ELEMENT ===============
    const tombolGen = document.getElementById('tombolGen');
    const hasilDiv = document.getElementById('hasilPanel');
    const tampilKey = document.getElementById('tampilKey');
    const tampilExp = document.getElementById('tampilExp');
    const tombolBack = document.getElementById('tombolBack');
    const durasiBtns = document.querySelectorAll('.durasi button');

    // =============== STATE ===============
    let hariTerpilih = 1;  // default 1 hari

    // =============== FUNGSI GENERATE KEY ===============
    function buatKey(hari) {
        const huruf = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
        let bagian = [];
        for (let i = 0; i < 4; i++) {
            let seg = '';
            for (let j = 0; j < 4; j++) {
                seg += huruf.charAt(Math.floor(Math.random() * huruf.length));
            }
            bagian.push(seg);
        }
        let kodeDurasi = '';
        if (hari === 1) kodeDurasi = '1D';
        else if (hari === 7) kodeDurasi = '7D';
        else kodeDurasi = '30D';
        
        return bagian.join('-') + '-' + kodeDurasi;
    }

    // =============== TAMPILKAN HASIL ===============
    function tampilkanHasil(hari) {
        let keyBaru = buatKey(hari);
        tampilKey.innerText = keyBaru;
        tampilExp.innerText = hari + ' DAYS';
        
        // Sembunyikan tombol generate dan tampilkan panel hasil
        tombolGen.style.display = 'none';
        hasilDiv.style.display = 'block';
    }

    // =============== KEMBALI KE MENU GENERATE ===============
    function kembaliKeGenerate() {
        tombolGen.style.display = 'block';
        hasilDiv.style.display = 'none';
    }

    // =============== EVENT UNTUK DURASI (1, 7, 30) ===============
    durasiBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            // Hapus class active dari semua
            durasiBtns.forEach(b => b.classList.remove('active'));
            // Tambah class active ke yang diklik
            this.classList.add('active');
            
            // Ambil nilai hari
            let hari = parseInt(this.getAttribute('data-hari'));
            if (!isNaN(hari)) {
                hariTerpilih = hari;
            }
            
            // Khusus tombol 30 hari, kasih warna premium (opsional)
            if (hariTerpilih === 30) {
                this.style.background = "#ff8800";
            } else {
                this.style.background = "";
            }
        });
    });

    // =============== EVENT GENERATE ===============
    tombolGen.addEventListener('click', function() {
        tampilkanHasil(hariTerpilih);
    });

    // =============== EVENT BACK (GENERATE LAGI) ===============
    tombolBack.addEventListener('click', function() {
        kembaliKeGenerate();
    });

    // =============== SET DEFAULT ACTIVE = 1 DAY ===============
    durasiBtns[0].classList.add('active');
    hariTerpilih = 1;
</script>
</body>
</html>
